
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Alfred about ideas, questions, and automotive-inspired design projects.">

    <title>Contact | Alfred Angelo Besa</title>

    <!-- SAME FONTS AS THE HOME PAGE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- JAVASCRIPT -->
    <script src="script.js" defer></script>
    <script type="module" src="auth.js"></script>
</head>

<body class="portfolio-inner-page contact-page">

    <!-- FIXED RACING VIDEO BACKGROUND -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="video3/racing3.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
    </div>

    <!-- DARK OVERLAY -->
    <div class="video-overlay"></div>

    <!-- HEADER -->
    <header>
        <nav class="navbar">

            <a class="logo" href="index.html">
                ALFRED<span>.</span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="goals.html">Goals</a></li>
                <li><a href="funfacts.html">Fun Facts</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a class="active" href="contact.html">Contact</a></li>
            </ul>

            <div class="user-controls">
                <span id="userEmail">Loading account...</span>

                <button
                    id="logoutButton"
                    type="button"
                    aria-label="Log out of your account">
                    LOG OUT ↗
                </button>
            </div>

        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main>

        <!-- PAGE BANNER -->
        <section class="page-banner">

            <span class="tag">Let's Connect</span>

            <h1>CONTACT <span>ME</span></h1>

            <p>
                Have a question, idea, or automotive design project?
            </p>

        </section>

        <!-- CONTACT FORM -->
        <section class="section">

            <h2 class="section-title">
                SEND A <span>MESSAGE</span>
            </h2>

            <p class="section-intro">
                Fill out the form below. All fields are required.
            </p>

            <!-- FIREBASE CONTACT FORM -->
            <form id="contactForm">

                <div class="form-group">

                    <label for="name">Full Name</label>

                    <input
                        id="name"
                        name="name"
                        type="text"
                        minlength="2"
                        maxlength="80"
                        required
                        placeholder="Enter your full name">

                </div>

                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        maxlength="150"
                        required
                        placeholder="you@example.com">

                </div>

                <div class="form-group">

                    <label for="subject">Subject</label>

                    <input
                        id="subject"
                        name="subject"
                        type="text"
                        minlength="3"
                        maxlength="100"
                        required
                        placeholder="What would you like to discuss?">

                </div>

                <div class="form-group">

                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        minlength="10"
                        maxlength="2000"
                        required
                        placeholder="Write your message here..."></textarea>

                </div>

                <button class="btn" type="submit">
                    SEND MESSAGE
                </button>

                <!-- SUCCESS OR ERROR MESSAGE -->
                <p
                    id="contactMessage"
                    class="form-message"
                    role="status"
                    aria-live="polite">
                </p>

            </form>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>
            © 2026 <span>Alfred Angelo Besa</span> | Get in Touch.
        </p>
    </footer>

</body>
</html>
