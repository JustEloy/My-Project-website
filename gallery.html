    <!-- PICTURE VIEWER -->
    <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Picture viewer">
        <div class="viewer-box">
            <button class="viewer-close" id="viewerClose" type="button" aria-label="Close picture">&times;</button>
            <img id="viewerImage" src="" alt="">
            <div class="viewer-caption">
                <strong id="viewerTitle"></strong>
                <span id="viewerText"></span>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 <span>Alfred Angelo Besa</span> | Gallery.</p>
    </footer>

    <!-- GALLERY JAVASCRIPT -->
    <script>
        (function () {
            var viewer = document.getElementById("viewer");
            var image = document.getElementById("viewerImage");
            var title = document.getElementById("viewerTitle");
            var text = document.getElementById("viewerText");
            var closeBtn = document.getElementById("viewerClose");
            var lastCard = null;

            function open(card) {
                var img = card.querySelector("img");

                image.src = img.getAttribute("src");
                image.alt = img.alt;

                title.textContent = card.querySelector("strong").textContent;
                text.textContent = card.querySelector("small").textContent;

                lastCard = card;
                viewer.classList.add("open");
                closeBtn.focus();
            }

            function close() {
                viewer.classList.remove("open");

                if (lastCard) {
                    lastCard.focus();
                }
            }

            Array.prototype.forEach.call(
                document.querySelectorAll(".photo-card"),
                function (card) {
                    card.addEventListener("click", function () {
                        open(card);
                    });
                }
            );

            closeBtn.addEventListener("click", close);

            viewer.addEventListener("click", function (e) {
                if (e.target === viewer) {
                    close();
                }
            });

            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape" && viewer.classList.contains("open")) {
                    close();
                }
            });
        })();
    </script>
